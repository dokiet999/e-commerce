{% extends "base.html" %}
{% block title %}Sign In — eCommerceStore{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Sign in to eCommerceStore</h1>
        <p class="sub">Welcome back!</p>
        <div class="form-error" id="loginError"></div>
        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" class="form-input" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" required placeholder="Your password">
            </div>
            <button type="submit" class="btn-auth" id="loginBtn">Sign in</button>
        </form>
        <div class="auth-footer">
            New to eCommerceStore? <a href="/register/">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('loginForm').addEventListener('submit', async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
        await handleLogin(email, password);
        showToast('Welcome back!', 'success');
        window.location.href = '/';
    } catch (e) {
        const msg = e.data?.detail || e.data?.error || 'Invalid email or password';
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign in';
    }
});
</script>
{% endblock %}
